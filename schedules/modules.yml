# The modules every schedule is built from: one teachable piece each, with
# its planned length. The schedule files (course-7week.yml, workshop-4day.yml,
# workshop-5day.yml) list module ids per session or day, and {{< schedule >}}
# turns them into the tables on the schedule pages.
#
#   id:      the name the schedule files use
#   title:   link text: the lesson number and name
#   page:    where the link goes, from the site's root folder
#   detail:  text after the link (optional)
#   minutes: planned length. After teaching a module, change it to the time
#            it took: every schedule that uses the module updates.
#   before:  true for setup, done before the first session
#
# Minutes marked "estimate" are not in the lessons yet: check them in class.
