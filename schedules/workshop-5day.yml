# The five-day workshop: the modules of each day, in order. {{< schedule
# workshop-5day >}} turns this into the tables on schedule-workshop.qmd.
# Same rules as workshop-4day.yml.
days:
  - title: "Organize and track"
    blocks:
      - "01-slides"
      - "03-slides"
      - "break"
      - "02-organization"
      - "lunch"
      - "03-hands-on"
      - "04-git-local"
      - "break"
      - "04-git-branches"
      - "Your own project under Git (30)"

  - title: "Environments"
    blocks:
      - "05-pixi-a"
      - "break"
      - "05-pixi-b"
      - "lunch"
      - "05-reproduce (60)"
      - "06-jupyter"
      - "break"
      - "Your own project: Pixi and a notebook (60)"

  - title: "Reports and containers"
    blocks:
      - "07-quarto-first"
      - "07-quarto-report"
      - "break"
      - "Your own project: a report in Quarto (45)"
      - "lunch"
      - "08-docker"
      - "break"
      - "08-image"
      - "08-apptainer"
      - "break"
      - "Your own project: your environment in a container (45)"

  - title: "Workflows"
    blocks:
      - "09-snakemake-a"
      - "break"
      - "09-snakemake-b"
      - "lunch"
      - "09-lab"
      - "break"
      - "10-nextflow-intro"
      - "Your own project: a first workflow (45)"

  - title: "Share"
    blocks:
      - "11-documentation"
      - "break"
      - "12-release"
      - "Your own project: README, license, citation (45)"
      - "lunch"
      - "12-swap"
      - "break"
      - "Own-project show-and-tell (60)"
      - "Wrap-up, checklist, next steps (20)"
