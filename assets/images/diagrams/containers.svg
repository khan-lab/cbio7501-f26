<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-labelledby="t d">
  <title id="t">Images and containers</title>
  <desc id="d">A Dockerfile and pixi.lock are built into an image with docker build. docker run starts containers from the image. Images are pushed to and pulled from a registry such as ghcr.io or Docker Hub. apptainer build converts an image from the registry into a single .sif file for HPC clusters.</desc>
  <!-- Own work, CBIO7501, CC BY 4.0 -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6475"/>
    </marker>
    <style>
      text { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #0f172a; }
      .t { font-size: 22px; font-weight: 650; }
      .s { font-size: 17px; fill: #5b6475; }
      .c { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 16px; fill: #1e293b; }
      .e { stroke: #5b6475; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- recipe -->
  <rect x="30" y="160" width="250" height="110" rx="14" fill="#f6f7f9" stroke="#cfd4dc" stroke-width="2"/>
  <text class="t" x="155" y="200" text-anchor="middle">Recipe</text>
  <text class="c" x="155" y="228" text-anchor="middle">Dockerfile</text>
  <text class="c" x="155" y="252" text-anchor="middle">+ pixi.lock</text>

  <!-- build arrow -->
  <path class="e" d="M282 215 H430" marker-end="url(#a)"/>
  <text class="c" x="356" y="203" text-anchor="middle">docker build</text>

  <!-- image (stacked layers) -->
  <rect x="452" y="150" width="270" height="110" rx="14" fill="#dfe7f8" stroke="#8fa6d6" stroke-width="2"/>
  <rect x="442" y="160" width="270" height="110" rx="14" fill="#eaf0fb" stroke="#8fa6d6" stroke-width="2"/>
  <text class="t" x="577" y="200" text-anchor="middle">Image</text>
  <text class="c" x="577" y="228" text-anchor="middle">ltee-project:0.1.0</text>
  <text class="s" x="577" y="254" text-anchor="middle">read-only, shareable</text>

  <!-- run arrows -->
  <path class="e" d="M714 200 C780 170 790 95 856 92" marker-end="url(#a)"/>
  <path class="e" d="M714 215 H856" marker-end="url(#a)"/>
  <path class="e" d="M714 230 C780 260 790 335 856 338" marker-end="url(#a)"/>
  <text class="c" x="786" y="207" text-anchor="middle">docker run</text>

  <!-- containers -->
  <g>
    <rect x="860" y="52" width="310" height="80" rx="14" fill="#e8f5ee" stroke="#7cbf9e" stroke-width="2"/>
    <text class="t" x="1015" y="88" text-anchor="middle">Container</text>
    <text class="s" x="1015" y="114" text-anchor="middle">a running copy</text>
    <rect x="860" y="175" width="310" height="80" rx="14" fill="#e8f5ee" stroke="#7cbf9e" stroke-width="2"/>
    <text class="t" x="1015" y="211" text-anchor="middle">Container</text>
    <text class="s" x="1015" y="237" text-anchor="middle">gone when it stops</text>
    <rect x="860" y="298" width="310" height="80" rx="14" fill="#e8f5ee" stroke="#7cbf9e" stroke-width="2"/>
    <text class="t" x="1015" y="334" text-anchor="middle">Container</text>
    <text class="s" x="1015" y="360" text-anchor="middle">sees only mounted folders</text>
  </g>

  <!-- registry -->
  <rect x="442" y="350" width="270" height="96" rx="14" fill="#fff4e5" stroke="#e0b46a" stroke-width="2"/>
  <text class="t" x="577" y="388" text-anchor="middle">Registry</text>
  <text class="s" x="577" y="416" text-anchor="middle">ghcr.io, Docker Hub</text>
  <path class="e" d="M560 272 V346" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="c" x="572" y="316">push / pull</text>

  <!-- apptainer -->
  <rect x="30" y="350" width="250" height="96" rx="14" fill="#f3eefb" stroke="#ab93d6" stroke-width="2"/>
  <text class="c" x="155" y="390" text-anchor="middle">ltee-project.sif</text>
  <text class="s" x="155" y="418" text-anchor="middle">one file, for HPC</text>
  <path class="e" d="M440 398 H284" marker-end="url(#a)"/>
  <text class="c" x="362" y="386" text-anchor="middle">apptainer</text>
  <text class="c" x="362" y="426" text-anchor="middle">build</text>
</svg>
